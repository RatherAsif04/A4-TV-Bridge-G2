name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK (Platform 37.0)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'

      - name: Verify Android drawables
        shell: bash
        run: |
          test -f app/src/main/res/drawable-nodpi/a4_mark.webp
          test -f app/src/main/res/drawable-nodpi/a4_tv.png

      - name: Run unit tests
        shell: bash
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew :app:testDebugUnitTest --stacktrace
          else
            gradle :app:testDebugUnitTest --stacktrace
          fi

      - name: Build Debug & Release APKs
        shell: bash
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
          else
            gradle :app:assembleDebug :app:assembleRelease --stacktrace
          fi

      - name: Prepare APK artifacts, sign release, & checksums
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-apks public-release
          cp app/build/outputs/apk/debug/app-debug.apk ci-apks/A4-TV-Bridge-1.4.4-debug.apk

          SIGNED_RELEASE=false
          if [ -n "${SIGNING_KEY_BASE64:-}" ] && [ -n "${SIGNING_STORE_PASSWORD:-}" ] && [ -n "${SIGNING_KEY_ALIAS:-}" ]; then
            KEYSTORE_PATH="$(mktemp)"
            trap 'rm -f "$KEYSTORE_PATH"' EXIT
            printf '%s' "$SIGNING_KEY_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"

            KS_TYPE="PKCS12"
            MAGIC="$(od -An -tx1 -N4 "$KEYSTORE_PATH" | tr -d ' \n')"
            if [ "$MAGIC" = "feedfeed" ]; then
              KS_TYPE="JKS"
            fi
            echo "Signing release APK with detected keystore type: $KS_TYPE"

            export KS_PASS="$SIGNING_STORE_PASSWORD"
            export KEY_PASS="${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}"

            APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
            if [ ! -x "$APKSIGNER" ]; then
              APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)"
            fi

            "$APKSIGNER" sign \
              --v4-signing-enabled false \
              --ks "$KEYSTORE_PATH" \
              --ks-type "$KS_TYPE" \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:KS_PASS \
              --key-pass env:KEY_PASS \
              --out ci-apks/A4-TV-Bridge-1.4.4-release.apk \
              app/build/outputs/apk/release/app-release-unsigned.apk

            rm -f ci-apks/*.idsig
            "$APKSIGNER" verify --print-certs ci-apks/A4-TV-Bridge-1.4.4-release.apk
            cp ci-apks/A4-TV-Bridge-1.4.4-release.apk public-release/A4-TV-Bridge-1.4.4-release.apk
            SIGNED_RELEASE=true
          else
            echo "Signing secrets not configured; falling back to debug + unsigned release APKs."
            cp app/build/outputs/apk/release/app-release-unsigned.apk ci-apks/A4-TV-Bridge-1.4.4-release-unsigned.apk
            cp ci-apks/A4-TV-Bridge-1.4.4-debug.apk public-release/A4-TV-Bridge-1.4.4-debug.apk
            cp ci-apks/A4-TV-Bridge-1.4.4-release-unsigned.apk public-release/A4-TV-Bridge-1.4.4-release-unsigned.apk
          fi

          echo "SIGNED_RELEASE=$SIGNED_RELEASE" >> "$GITHUB_ENV"
          (cd ci-apks && sha256sum *.apk > SHA256SUMS.txt)
          (cd public-release && sha256sum *.apk > SHA256SUMS.txt)
          echo "=== Public Release Checksums ==="
          cat public-release/SHA256SUMS.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: A4-TV-Bridge-1.4.4-APKs
          path: ci-apks/*

      - name: Publish GitHub Release (on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.4.4"
          TITLE="A4 TV Bridge 1.4.4 (Modern Android Standards, AMOLED, Adaptive Icon & UX Polish)"
          if [ "${SIGNED_RELEASE:-false}" = "true" ]; then
            INSTALL_NOTE='> **Public install:** Download and install `A4-TV-Bridge-1.4.4-release.apk` directly on Android phones or tablets (signed with the official release keystore). Existing users can also update in one tap via **About → Check for updates**. Debug APKs remain available under the GitHub Actions workflow artifacts.'
          else
            INSTALL_NOTE='> **Install note:** Install `A4-TV-Bridge-1.4.4-debug.apk` directly on Android phones/tablets for testing, or add your signing secrets (`SIGNING_KEY_BASE64`, `SIGNING_KEY_ALIAS`, `SIGNING_STORE_PASSWORD`, `SIGNING_KEY_PASSWORD`) in repository Settings to auto-sign the public release APK.'
          fi
          NOTES=$(cat <<EOF
          ## A4 TV Bridge 1.4.4 (Build 15) — Modern Android Standards, AMOLED & UX Polish
          Authored and licensed under **RatherAsif04 (MIT License)**. Built automatically from source via GitHub Actions.

          ### What's New in 1.4.4
          - **Adaptive & Monochrome Launcher Icons + Bundled Fonts**: Added full Android adaptive/round/monochrome icons alongside bundled **Plus Jakarta Sans** UI typography and **JetBrains Mono** for IPs, package IDs, and ADB shell output.
          - **AMOLED Black & Material You Dynamic Color**: Added a true-black **AMOLED Black** theme preset and an Android 12+ **Dynamic Color** toggle in **Appearance**.
          - **Android 15/16 Standards & Accessibility**: Enabled Predictive Back (\`OnBackInvokedCallback\`), guarded edge-to-edge system bar APIs on API 35+, enforced 48dp minimum touch targets across interactive controls, added D-pad focus rings, and added responsive tablet/TV container limits.
          - **Streamlined Navigation & Polish**: Added 1-tap **Saved TVs** on Welcome, **Rename TV** on Dashboard, direct **Apps** dock landing with quick pill strip, live **Installed / Update** badges in 1-Click Apps, upgraded **Free up space** storage overview card, quick command presets & history in **ADB Shell**, and semantic auto-dismissing notice banners.

          Debloat app lists and safety rules are based on [CleanYourTV](https://github.com/Gathin23/cleanyourtv) (MIT License, snapshot \`be60870\`).

          $INSTALL_NOTE
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" public-release/* --clobber
            gh release delete-asset "$TAG" A4-TV-Bridge-1.4.4-release.apk.idsig -y >/dev/null 2>&1 || true
            if [ "${SIGNED_RELEASE:-false}" = "true" ]; then
              gh release delete-asset "$TAG" A4-TV-Bridge-1.4.4-debug.apk -y >/dev/null 2>&1 || true
              gh release delete-asset "$TAG" A4-TV-Bridge-1.4.4-release-unsigned.apk -y >/dev/null 2>&1 || true
            fi
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" public-release/* --title "$TITLE" --notes "$NOTES"
          fi


