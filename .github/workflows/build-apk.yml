name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK (Platform 37.0)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Verify Android drawables
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          if [ ! -f app/src/main/res/drawable-nodpi/a4_mark.webp ] && [ -f src/assets/a4_mark.webp ]; then
            cp src/assets/a4_mark.webp app/src/main/res/drawable-nodpi/a4_mark.webp
          fi
          if [ ! -f app/src/main/res/drawable-nodpi/a4_tv.png ] && [ -f src/assets/a4_tv.png ]; then
            cp src/assets/a4_tv.png app/src/main/res/drawable-nodpi/a4_tv.png
          fi

      - name: Run unit tests
        shell: bash
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x ./gradlew
            ./gradlew :app:testDebugUnitTest --stacktrace
          else
            gradle :app:testDebugUnitTest --stacktrace
          fi

      - name: Build Debug & Release APKs
        shell: bash
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
          else
            gradle :app:assembleDebug :app:assembleRelease --stacktrace
          fi

      - name: Prepare APK artifacts, sign release, & checksums
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/A4-TV-Bridge-1.4.1-debug.apk

          SIGNED_RELEASE=false
          if [ -n "${SIGNING_KEY_BASE64:-}" ] && [ -n "${SIGNING_STORE_PASSWORD:-}" ] && [ -n "${SIGNING_KEY_ALIAS:-}" ]; then
            KEYSTORE_PATH="$(mktemp)"
            trap 'rm -f "$KEYSTORE_PATH"' EXIT
            printf '%s' "$SIGNING_KEY_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"

            KS_TYPE="PKCS12"
            MAGIC="$(od -An -tx1 -N4 "$KEYSTORE_PATH" | tr -d ' \n')"
            if [ "$MAGIC" = "feedfeed" ]; then
              KS_TYPE="JKS"
            fi
            echo "Signing release APK with detected keystore type: $KS_TYPE"

            export KS_PASS="$SIGNING_STORE_PASSWORD"
            export KEY_PASS="${SIGNING_KEY_PASSWORD:-$SIGNING_STORE_PASSWORD}"

            APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
            if [ ! -x "$APKSIGNER" ]; then
              APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)"
            fi

            "$APKSIGNER" sign \
              --v4-signing-enabled false \
              --ks "$KEYSTORE_PATH" \
              --ks-type "$KS_TYPE" \
              --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:KS_PASS \
              --key-pass env:KEY_PASS \
              --out release-apks/A4-TV-Bridge-1.4.1-release.apk \
              app/build/outputs/apk/release/app-release-unsigned.apk

            rm -f release-apks/*.idsig
            "$APKSIGNER" verify --print-certs release-apks/A4-TV-Bridge-1.4.1-release.apk
            SIGNED_RELEASE=true
          else
            echo "Signing secrets not configured; keeping unsigned release APK."
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-apks/A4-TV-Bridge-1.4.1-release-unsigned.apk
          fi

          echo "SIGNED_RELEASE=$SIGNED_RELEASE" >> "$GITHUB_ENV"
          (cd release-apks && sha256sum *.apk > SHA256SUMS.txt)
          cat release-apks/SHA256SUMS.txt

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: A4-TV-Bridge-1.4.1-APKs
          path: release-apks/*

      - name: Publish GitHub Release (on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.4.1"
          TITLE="A4 TV Bridge 1.4.1 (CleanYourTV Auto-Cleanup & Check my TV)"
          if [ "${SIGNED_RELEASE:-false}" = "true" ]; then
            INSTALL_NOTE='> **Public install:** Download and install `A4-TV-Bridge-1.4.1-release.apk` directly on Android phones or tablets (signed with the official release keystore).'
          else
            INSTALL_NOTE='> **Install note:** Install `A4-TV-Bridge-1.4.1-debug.apk` directly on Android phones/tablets for testing, or add your signing secrets (`SIGNING_KEY_BASE64`, `SIGNING_KEY_ALIAS`, `SIGNING_STORE_PASSWORD`, `SIGNING_KEY_PASSWORD`) in repository Settings to auto-sign the public release APK.'
          fi
          NOTES=$(cat <<EOF
          ## A4 TV Bridge 1.4.1 (Build 12) — CleanYourTV Auto-Cleanup & Check my TV
          Authored and licensed under **RatherAsif04 (MIT License)**. Built automatically from source via GitHub Actions.

          ### What's New in 1.4.1
          - **CleanYourTV-Powered Auto Clean Up TV (518 TV Lists)**: Automatically fingerprints your TV (\`manufacturer\`, \`brand\`, \`model\`, \`device\`, \`board\`) against 518 bundled CleanYourTV device profiles + \`tv.json\` metadata (or falls back to CleanYourTV \`match.py\` community consensus on unlisted TVs), pre-selects safe bloatware, shows community disable/kept counts, and cleans in one tap with live progress and post-run readback verification (\`pm list packages -e --user 0\`).
          - **Full CleanYourTV Safety Guards**: Automatically protects core boot/middleware packages (\`CORE_RE\` / \`CORE_OK\`), active Home launcher (ignoring \`FallbackHome\` and factory-test apps), \`setupwraith\` when it owns your saved Wi-Fi network, HDMI/AV input & \`TvInputService\` handlers, TV Settings handlers, and active keyboards.
          - **Undoable TV Animation Speedup**: 1-tap \`0.5x\` / \`0x\` / \`1x\` animation scale tuning with automatic pre-cleanup backup in **Restore**.
          - **Automatic Check my TV & Post-Reboot Verification**: Automatically syncs local + TV-side disabled logs (\`/data/local/tmp/a4tvbridge/disabled.txt\`), detects drifted/re-enabled apps with 1-tap re-disable, flags reverted Home launchers with **Put my home screen back**, warns on open \`ro.adb.secure=0\` ports, checks Private DNS & storage health, and auto-reconnects after **Restart TV & verify** on port \`5555\`.
          - **Enhanced Restore**: Restores individual or all disabled apps in one tap and restores original TV animation scales.

          Debloat app lists and safety rules are based on [CleanYourTV](https://github.com/Gathin23/cleanyourtv) (MIT License, snapshot \`be60870\`).

          $INSTALL_NOTE
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-apks/* --clobber
            gh release delete-asset "$TAG" A4-TV-Bridge-1.4.1-release.apk.idsig -y >/dev/null 2>&1 || true
            if [ "${SIGNED_RELEASE:-false}" = "true" ]; then
              gh release delete-asset "$TAG" A4-TV-Bridge-1.4.1-release-unsigned.apk -y >/dev/null 2>&1 || true
            fi
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" release-apks/* --title "$TITLE" --notes "$NOTES"
          fi

